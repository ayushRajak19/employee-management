<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="synergy-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152c39"/>
      <stop offset="100%" stop-color="#147461"/>
    </linearGradient>
    <linearGradient id="synergy-mid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#147461"/>
      <stop offset="100%" stop-color="#43aa94"/>
    </linearGradient>
    <linearGradient id="synergy-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#258d79"/>
      <stop offset="100%" stop-color="#5142cb"/>
    </linearGradient>
    <filter id="synergy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#147461" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g transform="translate(1, 16)" filter="url(#synergy-shadow)">
    <!-- Left dynamic slant -->
    <path d="M6 56 L24 12 C25 9 29 9 31 12 L38 32 L20 62 C18 65 14 65 12 63 L6 56 Z" fill="url(#synergy-left)"/>
    <!-- Central connecting chevron node -->
    <path d="M32 30 L45 8 C47 5 51 5 53 8 L66 30 L52 58 C50 61 46 61 44 58 L32 30 Z" fill="url(#synergy-mid)"/>
    <!-- Right dynamic slant -->
    <path d="M60 32 L67 12 C69 9 73 9 74 12 L92 56 L86 63 C84 65 80 65 78 62 L60 32 Z" fill="url(#synergy-right)"/>
    <!-- Center anchor jewel -->
    <circle cx="49" cy="22" r="4.5" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
